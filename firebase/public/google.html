<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulso · Google</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#12101B;color:#F6F2FF;font:16px system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h2{font-style:italic;text-transform:uppercase;font-size:28px;margin:0 0 8px}p{color:#A39CB9;margin:0 0 20px}
a,button{display:block;margin:12px auto;padding:16px 24px;border-radius:16px;border:0;font:800 16px system-ui;background:linear-gradient(135deg,#FF8A1F,#FF2E63);color:#fff;text-decoration:none;max-width:300px;cursor:pointer}
.s{width:56px;height:56px;border-radius:50%;border:6px solid #332D48;border-top-color:#FF5B2E;margin:0 auto 18px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head>
<body><div id="m"><div class="s"></div><h2>Pulso</h2><p>Conectando con Google…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDKg3MoBYJ2y7f7Isan_yWkXWI9PrJcOmE",authDomain:"pulso-app-e5ef5.firebaseapp.com",projectId:"pulso-app-e5ef5",appId:"1:24141123792:web:bd95e16a7e9b456b878ed5"});
var a=firebase.auth(),m=document.getElementById('m');
function back(t){var u='intent://auth?idt='+encodeURIComponent(t)+'#Intent;scheme=pulso;package=com.pulso.app;end';
 m.innerHTML='<h2>¡Listo!</h2><p>Tu cuenta de Google quedó conectada.</p><a id="b" href="'+u+'">Volver a Pulso</a>';location.href=u}
function go(){var p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});a.signInWithRedirect(p)}
a.getRedirectResult().then(function(r){if(r&&r.credential&&r.credential.idToken)back(r.credential.idToken);else go()})
 .catch(function(e){m.innerHTML='<h2>No se pudo conectar</h2><p>'+(e.message||'Probá de nuevo.')+'</p><button onclick="go()">Reintentar con Google</button>'});
</script></body></html>
