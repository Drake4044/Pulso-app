// Módulo de la app Android de Pulso.
// La app es un WebView que carga assets/index.html (copia de app/pulso.html), así que casi no
// tiene dependencias: solo las de inicio de sesión con Google (Credential Manager).
plugins { id 'com.android.application' }

// La clave de firma NO se sube al repositorio. Se lee de android/keystore.properties (ignorado por git).
// Si ese archivo no existe, el APK de release se genera sin firmar (para firmarlo después).
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
  namespace 'com.pulso.app'
  compileSdk 35
  // minSdk 26 (Android 8): cubre casi todos los celulares en uso y trae los canales de notificación.
  defaultConfig { applicationId 'com.pulso.app'; minSdk 26; targetSdk 34; versionCode 28; versionName '1.27' }
  signingConfigs {
    rel {
      if (ksFile.exists()) {
        storeFile file(ks['storeFile']); storePassword ks['storePassword']
        keyAlias ks['keyAlias']; keyPassword ks['keyPassword']; storeType 'pkcs12'
      }
    }
  }
  buildTypes {
    release {
      // R8 achica y ofusca el código Java; shrinkResources borra recursos que no se usan.
      minifyEnabled true; shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (ksFile.exists()) signingConfig signingConfigs.rel
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
  // Inicio de sesión con Google (API moderna de Android para credenciales)
  implementation 'androidx.credentials:credentials:1.3.0'
  implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
  implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
