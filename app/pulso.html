<!--
  ============================================================================================
  PULSO · app de entrenamiento en casa
  ============================================================================================
  Todo el frontend vive en este único archivo: HTML + CSS + JavaScript sin frameworks.

  ¿Por qué un solo archivo y JavaScript "puro" (sin React/Vue)?
   - La app corre dentro de un WebView de Android (ver android/…/MainActivity.java). Un único
     index.html empaquetado en el APK abre al instante y funciona sin internet.
   - Sin paso de compilación: se edita, se copia a assets/ y listo. Menos herramientas que aprender.
   - Celulares de gama baja (se probó en un Moto G15): sin framework hay menos JavaScript que
     descargar, analizar y ejecutar, así que la app arranca y responde más rápido.

  Cómo está organizado (buscá los títulos "/* ---------- … ---------- */" dentro del bloque de script):
   1. estilos        Diseño: variables de color (tema claro/oscuro), componentes, animaciones.
   2. iconos        Íconos SVG dibujados a mano (sin librerías de íconos).
   3. datos         Ejercicios (EX), grupos (G), músculos (MUS), estiramientos (STR) y fuentes (SRC).
   4. esquema       Figura del cuerpo con los músculos que se iluminan en naranja (BREGS).
   5. figuras       Motor que anima las figuras de palitos de cada ejercicio.
   6. estado        Objeto S (estado de la app) y store (localStorage).
   7. vistas        Cada pantalla es una función V.nombre() que devuelve HTML como texto.
   8. sesión, voz, cámara (detección de postura), nube (Firebase), notificaciones…
   9. render/eventos  render() dibuja la vista actual; un solo listener de clicks despacha
                      las acciones según el atributo data-act de cada botón.

  Patrón general: estado → render() → HTML. Cuando algo cambia se actualiza S y se llama a
  render() (o se toca solo el pedacito de pantalla que cambió, cuando hace falta que sea fluido).
  ============================================================================================
-->
<title>Pulso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* =====================================================================
   ESTILOS
   - Todos los colores son variables (--bg, --surface, --ember…). El tema claro solo
     redefine esas variables; así no hay que duplicar reglas por tema.
   - Animaciones con transform y opacity: el navegador las hace en la GPU sin
     recalcular el layout, por eso se ven fluidas incluso en celulares modestos.
   - "html.lite": modo liviano que se activa solo en equipos lentos (saca desenfoques).
   ===================================================================== */
/* Layout: phone-width app column, sticky header, floating bottom nav; one bold gradient (today's workout), everything else calm ink surfaces */
:root{
  --bg:#12101B; --surface:#1B1827; --surface-2:#252136; --line:#332D48;
  --fg:#F6F2FF; --muted:#A39CB9; --ink-on-accent:#FFFFFF;
  --musc:#3B3552; --musc2:#2A253B;
  --ember:#FF5B2E; --blaze:#FF2E63; --volt:#FFC93C; --mint:#2EE6A8; --violet:#9D8CFF; --tang:#FF9F1C; --sky:#3FA9FF;
  --grad:linear-gradient(135deg,#FF8A1F 0%,#FF4A3D 45%,#FF2E63 100%);
  --glow:rgba(255,91,46,.28);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFF7F2; --surface:#FFFFFF; --surface-2:#FFEDE3; --line:#F0DCD0;
  --fg:#1C1525; --muted:#6F6478; --musc:#E6D3C7; --musc2:#F3E6DD;
  --ember:#EE4A1C; --blaze:#E3164E; --volt:#C98F00; --mint:#0C9C6D; --violet:#6B55E8; --tang:#E07A00; --sky:#1B7FD1;
  --glow:rgba(238,74,28,.18); --shadow:0 10px 28px rgba(120,50,20,.12); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#FFF7F2; --surface:#FFFFFF; --surface-2:#FFEDE3; --line:#F0DCD0;
  --fg:#1C1525; --muted:#6F6478; --musc:#E6D3C7; --musc2:#F3E6DD;
  --ember:#EE4A1C; --blaze:#E3164E; --volt:#C98F00; --mint:#0C9C6D; --violet:#6B55E8; --tang:#E07A00; --sky:#1B7FD1;
  --glow:rgba(238,74,28,.18); --shadow:0 10px 28px rgba(120,50,20,.12); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}

.app{max-width:460px;margin:0 auto;min-height:100%;position:relative;padding-bottom:110px}
.app.nonav{padding-bottom:24px}
.wrap{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.view{animation:viewIn .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

/* type */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
.h-xl{font-size:46px}.h-l{font-size:34px}.h-m{font-size:24px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec-title h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.link{color:var(--ember);font-weight:700;font-size:13px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-block:12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);transition:transform .15s,background .2s;position:relative;flex:none}
.iconbtn:active{transform:scale(.92)}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--blaze);box-shadow:0 0 0 2px var(--surface)}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink-on-accent);flex:none}
.logo{font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--grad);display:inline-block;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}45%{transform:scale(1.2)}}

/* today hero */
.today{position:relative;border-radius:26px;background:var(--grad);color:#fff;padding:22px;overflow:hidden;box-shadow:0 18px 40px var(--glow);isolation:isolate}
.today::before{content:"";position:absolute;inset:-40% -30% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%);z-index:-1;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-40px,30px)}}
.today .eyebrow{color:rgba(255,255,255,.82)}
.today h1{margin-top:6px;max-width:62%}
.today .meta{display:flex;gap:14px;margin-top:12px;font-weight:600;font-size:13px;flex-wrap:wrap}
.today .meta span{display:flex;align-items:center;gap:5px}
.today .fig-holder{position:absolute;right:-6px;bottom:6px;width:46%;max-width:190px;opacity:.95}
.today .fig line,.today .fig circle{stroke:#fff}
.today .fig .floor{stroke:rgba(255,255,255,.35)}
.today .fig .hl{stroke:#FFE27A}
.today .fig .eq{stroke:#2A1530}
.btn-go{margin-top:18px;display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1C1525;font-weight:800;padding:13px 20px 13px 16px;border-radius:16px;transition:transform .15s,box-shadow .2s;box-shadow:0 8px 20px rgba(60,10,20,.25)}
.btn-go:hover{transform:translateY(-1px)}
.btn-go:active{transform:scale(.96)}
.btn-go .pp{width:28px;height:28px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff}
.btn-go .pp svg{width:12px;height:12px}
.today.rest{background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.today.rest .eyebrow{color:var(--muted)}

/* carousel */
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;padding-bottom:22px;margin-bottom:-18px}
.car::-webkit-scrollbar{display:none}
.car>.today{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;min-width:0;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .5s}
.car>.today:not(.act){transform:scale(.93);opacity:.5}
.car>.today.act>.eyebrow,.car>.today.act>h1,.car>.today.act>p,.car>.today.act>.slide-ft,.car>.today.act>.btn-go{animation:slideIn .55s cubic-bezier(.2,.8,.2,1) both}
.car>.today.act>h1{animation-delay:.07s}.car>.today.act>.slide-ft,.car>.today.act>.btn-go,.car>.today.act>p{animation-delay:.14s}
.car>.today.act>.fig-holder{animation:figIn .7s cubic-bezier(.2,.8,.2,1) .05s both}
@keyframes slideIn{from{opacity:0;transform:translateX(var(--dx,34px))}}
@keyframes figIn{from{opacity:0;transform:translateX(calc(var(--dx,34px) * 2)) scale(.9)}}
.today.alt{background:linear-gradient(140deg,color-mix(in srgb,var(--c) 26%,var(--surface)) 0%,var(--surface) 72%);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.today.alt .eyebrow{color:var(--muted)}
.today.alt .fig line,.today.alt .fig circle{stroke:var(--fg)}
.today.alt .fig .hl{stroke:var(--c)}.today.alt .fig .eq{stroke:var(--volt)}.today.alt .fig .floor{stroke:var(--line)}
.exchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-width:62%;position:relative;z-index:1}
.exchips span{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.2)}
.today.alt .exchips span{background:var(--surface-2)}
.slide-ft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.slide-ft .btn-go{margin-top:0}
.stp{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:999px}
.stp .ic{width:15px;height:15px}
.stp.done{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.stp.miss{background:color-mix(in srgb,var(--blaze) 16%,transparent);color:var(--blaze)}
.stp.plan{background:var(--surface-2);color:var(--muted)}
.btn-go.ghosty{background:var(--fg);color:var(--bg);padding:11px 16px;box-shadow:none}
.cdots{display:flex;justify-content:center;align-items:center;gap:2px;margin-top:10px}
.cdots button{width:20px;height:20px;padding:6.5px;border-radius:10px;background:var(--line);background-clip:content-box;transition:width .35s cubic-bezier(.3,1.3,.5,1),background-color .3s}
.cdots button.tdy{background-color:color-mix(in srgb,var(--ember) 50%,var(--line))}
.cdots button.on{width:36px;background-color:var(--ember)}
.carlbl{text-align:center;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.wd{transition:transform .3s cubic-bezier(.3,1.4,.5,1),border-color .25s,box-shadow .25s;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted)}
.wd b{font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.wd .st{width:7px;height:7px;border-radius:50%;background:transparent;border:1.5px solid var(--line)}
.wd.done .st{background:var(--mint);border-color:var(--mint)}
.wd.miss .st{background:var(--blaze);border-color:var(--blaze);opacity:.75}
.wd.plan .st{border-color:var(--ember)}
.wd.is-today{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 12%,var(--surface));color:var(--ember)}
.wd.is-today .st{background:var(--ember);border-color:var(--ember)}
.wd.rest .st,.wlegend .blk{background:#050408;border-color:color-mix(in srgb,var(--fg) 28%,transparent)}
.wd.plan .st{border-color:var(--muted)}
.wd.rest{background:color-mix(in srgb,#000 55%,var(--surface));color:color-mix(in srgb,var(--muted) 80%,transparent)}
.wd.sel{transform:translateY(-3px);border-color:var(--fg);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.wd.is-today.sel{border-color:var(--ember);box-shadow:0 8px 18px var(--glow)}
.wd:active{transform:scale(.94)}
.wlegend{justify-content:center;margin-top:10px}
.wlegend i{border-radius:50%}
.wlegend .blk{border:1.5px solid}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat .fl{color:var(--ember)}

/* group grid */
.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{--c:var(--ember);position:relative;text-align:left;border-radius:22px;padding:14px 14px 12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end}
.gcard::after{content:"";position:absolute;inset:auto -30% -55% -30%;height:85%;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--c) 30%,transparent),transparent 65%);opacity:.7;transition:opacity .3s;z-index:0}
.gcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.gcard:hover::after{opacity:1}
.gcard:active{transform:scale(.97)}
.gcard .gfig{position:absolute;top:4px;right:2px;width:62%;z-index:1}
.gcard .gfig .hl{stroke:var(--c)}
.gcard .gfig .gl.hl{fill:var(--c)}
.gcard .nm{position:relative;z-index:1;font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;text-transform:uppercase;line-height:1}
.gcard .ct{position:relative;z-index:1;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.gcard .bar{position:relative;z-index:1;height:4px;width:34px;border-radius:4px;background:var(--c);margin-bottom:10px}

/* figure */
.fig{width:100%;height:auto;overflow:visible}
.fig line{stroke:var(--fg);stroke-width:7;stroke-linecap:round}
.fig line.torso{stroke-width:10}
.fig circle.head{fill:none;stroke:var(--fg);stroke-width:6}
.fig .far line{opacity:.32}
.fig .floor{stroke:var(--line);stroke-width:2;stroke-dasharray:2 6}
.fig .hl{stroke:var(--ember)}
.fig .gl{fill:transparent;stroke:none}
.fig .gl.hl{fill:var(--ember);stroke:none}
.fig circle.sj{fill:transparent;stroke:none}
.fig circle.sj.hl{fill:var(--ember)}
.fig .eq{stroke:var(--volt);stroke-width:6}
.fig .plate{fill:none;stroke:var(--volt);stroke-width:4}
.fig .bar{stroke:var(--muted);stroke-width:4;stroke-dasharray:none}

/* group page */
.ghead{position:relative;padding:8px 0 4px}
.ghead .display{color:var(--c)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;transition:all .2s;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.c-on{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c);color:var(--fg)}
.exlist{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.excard{--c:var(--ember);display:grid;grid-template-columns:116px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px 14px 10px 10px;transition:transform .2s,border-color .2s}
.excard:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line));transform:translateX(3px)}
.excard:active{transform:scale(.98)}
.thumb{position:relative;border-radius:16px;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--c) 22%,var(--surface-2)),var(--surface-2) 70%);aspect-ratio:1;max-width:100%;padding:8px;overflow:hidden}
.thumb .fig .hl{stroke:var(--c)}.thumb .fig .gl.hl,.thumb .fig .sj.hl{fill:var(--c)}
.thumb .live{position:absolute;left:8px;top:8px;font-size:9.5px;font-weight:800;letter-spacing:.1em;background:rgba(0,0,0,.45);color:#fff;padding:3px 6px;border-radius:6px;display:flex;align-items:center;gap:4px}
.thumb .live::before{content:"";width:5px;height:5px;border-radius:50%;background:#FF4A4A;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.excard h3{font-size:16.5px;font-weight:800;line-height:1.2}
.excard .tg{font-size:12.5px;color:var(--c);font-weight:700;margin-top:3px}
.excard .row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--surface-2);color:var(--muted)}

/* exercise detail / player */
.stage{--c:var(--ember);position:relative;border-radius:26px;background:radial-gradient(120% 90% at 50% 100%,color-mix(in srgb,var(--c) 26%,var(--surface-2)) 0%,var(--surface-2) 55%,var(--surface) 100%);border:1px solid var(--line);overflow:hidden;padding:18px 18px 0}
.stage .fig{max-width:300px;margin:0 auto}
.stage .fig .hl{stroke:var(--c)}.stage .fig .gl.hl,.stage .fig .sj.hl{fill:var(--c)}
.stage .badge{position:absolute;left:14px;top:14px;display:flex;gap:6px}
.stage .reps{position:absolute;right:14px;top:12px;text-align:right}
.stage .reps b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.stage .reps span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ctrl{display:flex;align-items:center;gap:10px;padding:12px 4px 16px}
.playbtn{width:54px;height:54px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px var(--glow);transition:transform .15s;flex:none}
.playbtn:active{transform:scale(.9)}
.playbtn svg{width:20px;height:20px}
.prog{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:0}
.prog i{display:block;height:100%;width:0;background:var(--c);border-radius:6px}
.speeds{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.speeds button{font-size:12px;font-weight:800;padding:6px 8px;border-radius:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.speeds button.on{background:var(--fg);color:var(--bg)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.fact span{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fact b{font-size:15px;font-weight:800}
.mus{display:flex;flex-wrap:wrap;gap:8px}
.mus .m{padding:8px 12px;border-radius:12px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:7px}
.mus .m i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.mus .m.p i{background:var(--c)}
.mus .m.p{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 12px;counter-increment:s}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;background:color-mix(in srgb,var(--c) 16%,var(--surface-2));color:var(--c)}
.tip{display:flex;gap:12px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--volt) 12%,var(--surface));border:1px dashed color-mix(in srgb,var(--volt) 55%,var(--line));margin-top:12px;font-size:14px}
.tip b{color:var(--volt)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:18px;font-weight:800;font-size:15.5px;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 12px 28px var(--glow)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.light{background:#fff;color:#1C1525}

/* anatomy */
.anat{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px;margin-bottom:12px}
.anat-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.anat-h b{font-size:14px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;flex:none}
.seg button{padding:6px 10px;border-radius:9px;font-size:12px;font-weight:800;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--fg);color:var(--bg)}
.bodies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bodies figure{margin:0;text-align:center;min-width:0}
.bodies figcaption{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.bm{width:100%;max-width:150px;height:auto;margin:0 auto;overflow:visible}
.bm .nt{fill:var(--musc2);stroke:var(--musc2)}
.bm .mu{fill:var(--musc);stroke:var(--surface);stroke-width:1.1;transition:fill .3s;transform-box:fill-box;transform-origin:center}
.bm .mu.s{fill:color-mix(in srgb,var(--c) 42%,var(--musc))}
.bm .mu.p{fill:var(--c)}
.bm .halo{fill:var(--c);opacity:0;filter:blur(6px);transform-box:fill-box;transform-origin:center}
.legend2{display:flex;gap:14px;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:8px}
.legend2 span{display:flex;align-items:center;gap:6px}.legend2 i{width:10px;height:10px;border-radius:3px}
.grow svg{width:100%;height:auto;display:block}
.focus-stage{--c:inherit;position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(90% 80% at 50% 55%,color-mix(in srgb,var(--c) 18%,var(--surface-2)),var(--surface-2) 70%);margin-top:4px}
.focus-stage .fig{aspect-ratio:104/92;max-width:100%}
.focus-stage .fig line{stroke-width:4;opacity:.8}.focus-stage .fig line.torso{stroke-width:6}.focus-stage .fig circle.head{stroke-width:3.5;opacity:.8}.focus-stage .fig .eq{opacity:1}
.focus-stage .fig .hl{stroke:var(--fg)}.focus-stage .fig .gl.hl,.focus-stage .fig .sj.hl{fill:transparent}
.focus-stage .fig .floor{stroke-width:1}
.mbelly{fill:var(--c);filter:drop-shadow(0 0 3px var(--c))}
.callout line{stroke:var(--fg);stroke-width:.6;stroke-dasharray:1.5 1.2}
.callout circle{fill:var(--fg)}
.callout rect{fill:var(--fg)}
.callout text{fill:var(--bg);font:800 5.6px var(--body);letter-spacing:.02em}
.slow{position:absolute;left:10px;top:10px;z-index:1;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.5);color:#fff;padding:4px 8px;border-radius:7px;display:flex;align-items:center;gap:5px}
.slow i{width:6px;height:6px;border-radius:50%;background:#FF4A4A;animation:blink 1.2s infinite}
.zoom .bone{fill:var(--musc2);stroke:var(--line);stroke-width:1.5}
.zoom .tendon{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.zoom .belly{fill:var(--c)}
.zoom .fiber{fill:none;stroke:rgba(255,255,255,.45);stroke-width:1.4;stroke-linecap:round}
.zoom-l{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.zoom-l b{font-size:14px}
.tens{flex:1;max-width:140px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.tens i{display:block;height:100%;background:var(--c);border-radius:6px}
.grow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.grow .fb{fill:var(--c);transition:transform 1s cubic-bezier(.3,1.4,.5,1),opacity .6s;transform-box:fill-box;transform-origin:center}
.grow .tear{stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;opacity:0;transition:opacity .4s}
.grow .nut{fill:var(--mint);opacity:0;transition:opacity .4s}
.grow .ring0{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 4}
.grow.st1 .tear{opacity:.9;animation:blink .8s infinite}
.grow.st2 .nut{opacity:1}
.grow.st2 .nut{animation:feed 1.6s ease-in infinite}
.grow.st3 .fb{transform:scale(1.2)}
@keyframes feed{from{transform:translate(var(--nx),var(--ny));opacity:0}30%{opacity:1}to{transform:none;opacity:0}}
.steps3{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.steps3 button{font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:9px;background:var(--surface-2);color:var(--muted);transition:all .25s}
.steps3 button.on{background:color-mix(in srgb,var(--c) 20%,var(--surface-2));color:var(--fg)}
.grow p{font-size:13.5px}

/* session → detail */
.sess-stage{cursor:pointer;transition:transform .2s}
.sess-stage:active{transform:scale(.98)}
.seemore{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line)}
.seemore .ic{width:15px;height:15px;color:var(--c)}
.insess{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--ember) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--ember) 40%,var(--line));font-weight:700;font-size:13px;margin-bottom:12px}
.insess i{width:8px;height:8px;border-radius:50%;background:var(--ember);animation:blink 1.2s infinite}

/* train */
.cta2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.modes{display:grid;gap:10px;margin:14px 0}
.mode{text-align:left;padding:16px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface-2);display:grid;gap:4px;cursor:pointer;transition:border-color .2s,background .2s}
.mode b{font-size:16.5px}.mode>span{font-size:13px;color:var(--muted)}
.mode.on{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 12%,var(--surface-2))}
.stepper{display:flex;align-items:center;gap:16px;margin-top:8px}
.stepper button{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:800}
.stepper em{font-style:normal;font-family:var(--display);font-weight:800;font-size:36px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.ttop{display:flex;align-items:center;gap:12px;padding-block:14px}
.ttop .tt{flex:1;min-width:0}.ttop .tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttop .tt span{font-size:12px;color:var(--muted);font-weight:700}
.timer{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.counter{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:6px auto 2px;transition:opacity .3s}
.counter svg{width:100%;height:100%;transform:rotate(-90deg)}
.counter circle{fill:none;stroke-width:14}
.counter .cbg{stroke:var(--line)}.counter .cbg.free{stroke:color-mix(in srgb,var(--c) 35%,var(--line));stroke-dasharray:3 9}
.counter .cfg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.3,1.3,.5,1)}
.counter .cin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.counter b{font-family:var(--display);font-weight:800;font-size:96px;line-height:.9;font-variant-numeric:tabular-nums;display:block}
.counter small{font-weight:700;color:var(--muted);font-size:14px}
.counter.bump b{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{35%{transform:scale(1.28);color:var(--ember)}}
.counter .ripple{position:absolute;inset:14%;border-radius:50%;border:3px solid var(--ember);opacity:0;pointer-events:none}
.counter.bump .ripple{animation:ripple .65s ease-out}
@keyframes ripple{from{opacity:.8;transform:scale(.8)}to{opacity:0;transform:scale(1.4)}}
.counter.paused{opacity:.4}
.counter.res b{font-size:84px}
.medal{position:absolute;right:6%;bottom:8%;width:54px;height:54px;border-radius:50%;background:var(--mint);color:#06281D;display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1) .5s both;box-shadow:0 8px 20px color-mix(in srgb,var(--mint) 40%,transparent)}
.medal svg{width:28px;height:28px;stroke-width:3}
.tmot{text-align:center;font-weight:800;min-height:1.5em;color:var(--ember);margin-top:4px}
.micbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px}
.micbox.err{border-color:var(--blaze)}
.microw{display:flex;align-items:center;gap:10px}
.meter{flex:1;min-width:40px;height:10px;border-radius:10px;background:var(--surface-2);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--mint),var(--volt),var(--ember));border-radius:10px}
.meter span{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--fg);opacity:.55}
#micMsg{font-size:13px;font-weight:700;margin-top:8px;display:block}
#micMsg .link{font-size:13px;text-decoration:underline}
.tbtns{display:flex;align-items:center;justify-content:center;gap:22px;margin:16px 0}
.roundbtn{width:58px;height:58px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:17px;transition:transform .15s}
.roundbtn:active{transform:scale(.9)}
.playbtn.xl{width:78px;height:78px}.playbtn.xl svg{width:26px;height:26px}
.tap-area{width:100%;padding:24px;border-radius:20px;border:2px dashed var(--line);font-weight:800;color:var(--muted);margin-bottom:12px}
.tap-area:active{background:var(--surface)}
.tmini{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 12px 8px 8px;margin-bottom:12px}
.tmini .thumb{width:72px;flex:none}
.quote{font-family:var(--display);font-style:italic;font-weight:700;font-size:22px;line-height:1.15;text-transform:uppercase;max-width:24ch;margin:6px auto 12px;color:var(--fg)}
.saved{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mint);font-weight:800;font-size:13.5px;margin-bottom:14px}
.hb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;background:color-mix(in srgb,var(--c) 20%,var(--surface-2));color:var(--c);flex:none}
/* analysis */
.camwrap{position:relative;border-radius:22px;overflow:hidden;background:#000;margin:0 auto;max-width:100%;aspect-ratio:3/4}
.camwrap video,.camwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.camwrap video{object-fit:cover}
.camwrap.mirror video,.camwrap.mirror canvas{transform:scaleX(-1)}
.rec-hud{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;z-index:2;color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.recdot{background:#E5243B;color:#fff;font-size:11px;font-weight:800;letter-spacing:.1em;padding:4px 8px;border-radius:7px;animation:blink 1.2s infinite}
.anreps{position:absolute;right:12px;top:10px;text-align:right;color:#fff;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.anreps b{display:block;font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.anreps span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.count3{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:150px;color:#fff;z-index:3;text-shadow:0 6px 30px rgba(0,0,0,.6);pointer-events:none}
.count3.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.anmsg{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;color:#fff;font-weight:700;font-size:13px;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:10px}
.loader{width:110px;height:110px;border-radius:50%;border:8px solid var(--line);border-top-color:var(--ember);animation:spin 1s linear infinite;margin:40px auto 22px}
@keyframes spin{to{transform:rotate(360deg)}}
.score{display:flex;align-items:center;gap:16px}
.sring{position:relative;width:104px;flex:none}
.sring svg{width:100%;transform:rotate(-90deg)}
.sring circle{fill:none;stroke-width:10}.sring .cbg{stroke:var(--line)}.sring .cfg{stroke:url(#rg);stroke-linecap:round}
.sring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:38px}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.chk .ci{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.chk.ok .ci{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.chk.warn .ci{background:color-mix(in srgb,var(--volt) 22%,transparent);color:var(--volt)}
.chk.info .ci{background:var(--surface-2);color:var(--muted)}
.bigicon{width:72px;height:72px;border-radius:22px;margin:0 auto;display:grid;place-items:center;background:color-mix(in srgb,var(--volt) 20%,var(--surface));color:var(--volt)}
.bigicon svg{width:34px;height:34px}
/* splash + confetti */
.splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px;text-align:center;transition:opacity .55s}
.splash.out{opacity:0;pointer-events:none}
.splash .logo{font-size:30px}
.splash{background:#12101B!important;color:#fff;overflow:hidden;contain:strict}html.spl-on,html.spl-on body{overflow:hidden!important}.splash .muted{color:#9a96ad}
.spl-vid{position:absolute;left:50%;top:50%;width:520px;height:560px;transform:translate(-50%,calc(-50% - 15px));pointer-events:none;background:#12101B;opacity:0;transition:opacity .12s}.spl-vid.on{opacity:1}
.spl-vid::-webkit-media-controls,.spl-vid::-webkit-media-controls-start-playback-button,.spl-vid::-webkit-media-controls-overlay-play-button{display:none!important;-webkit-appearance:none}
.spl-vid{
 -webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(closest-side,#000 72%,transparent 100%)}
.splash .spl-logo{opacity:0}.splash.logo-on .spl-logo{opacity:1}.splash .plogo{filter:none}
.lbar{position:relative;width:min(240px,70vw);height:10px;border-radius:99px;background:#07060b;box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);margin:2px 0 6px}
.lfill{position:absolute;left:0;top:0;bottom:0;width:100%;transform:scaleX(0);transform-origin:left center;will-change:transform;border-radius:inherit;background:linear-gradient(90deg,rgba(57,255,136,.15),#39ff88);box-shadow:0 0 10px rgba(57,255,136,.7)}
.ldw{position:absolute;left:0;top:50%;width:0;height:0;will-change:transform}.ldot{position:absolute;top:0;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:3.5px solid #5dffa0;box-shadow:0 0 6px 2px #39ff88,0 0 18px 6px rgba(57,255,136,.6);animation:lgDotBeat 1.5s ease-in-out infinite}
.lbar.done{}.lbar.done .lfill{box-shadow:0 0 14px 3px rgba(57,255,136,.9)}
.lbar.done .ldot{animation:barDot 1.5s ease-in-out infinite}
@keyframes barBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.06,1.35)}30%{transform:scale(1)}45%{transform:scale(1.04,1.2)}70%{transform:scale(1)}}
@keyframes barDot{0%,100%{transform:scale(1.1)}15%{transform:scale(1.9);box-shadow:0 0 10px 4px #39ff88,0 0 30px 12px rgba(57,255,136,.8)}30%{transform:scale(1.05)}45%{transform:scale(1.6)}70%{transform:scale(1.1)}}
.splash{transition:opacity .7s}.splash .spl-txt{opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s}.splash.ready .spl-txt{opacity:1;transform:none}
/* logo */
.pbeat.intro .pring{display:none}.pbeat.intro.s3 .pring{display:block}
.pbeat.intro .lg-bg{opacity:0}.pbeat.intro.s3 .lg-bg{opacity:1}
.pbeat.intro:not(.s3) .plogo{filter:none}
.pbeat.intro .lg-dot{opacity:0}
.pbeat.intro.s1 .lg-dot{animation:lgOn 1s ease-out forwards}
@keyframes lgOn{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(2.1)}55%{transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
.lg-burst{opacity:0;transform-box:fill-box;transform-origin:center}
.pbeat.intro.s2 .lg-burst{animation:lgBurst 1.15s cubic-bezier(.2,.7,.3,1) forwards}
.lg-flash{opacity:0}.pbeat.intro.s2 .lg-flash{animation:lgFlash 1.2s ease-out forwards}
@keyframes lgFlash{0%{opacity:0}20%{opacity:1}42%{opacity:1}100%{opacity:0}}

.lg-dot{transform-box:fill-box;transform-origin:center}
.pbeat.live .lg-dot,.pbeat:not(.intro) .lg-dot{opacity:1;animation:lgDotBeat 1.5s ease-in-out infinite}
@keyframes lgDotBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.5)}30%{transform:scale(.95)}45%{transform:scale(1.3)}70%{transform:scale(1)}}
.spl-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-60%)}
.spl-txt{position:absolute;left:24px;right:24px;top:calc(50% + 66px);display:flex;flex-direction:column;align-items:center;gap:14px}
.splash p{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;line-height:1.05;max-width:15ch;text-transform:uppercase;animation:rise .7s .15s both}
.splash .sbar{width:140px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.splash .sbar i{display:block;height:100%;width:0;background:var(--grad);animation:fillbar 1.9s ease-in-out forwards}
@keyframes fillbar{to{width:100%}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:150}

/* auth */
.authv{padding-bottom:30px}
.authv .form{gap:8px}
.fl{font-size:13px;font-weight:800;margin-top:6px}
.hint{font-size:12px;color:var(--muted);font-weight:600;min-height:1.2em}
.hint.good{color:var(--mint)}.hint.bad{color:var(--blaze)}
.atw{position:relative}.atw span{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800}.atw .inp{padding-left:32px}
.pw{position:relative}.pw .inp{padding-right:78px}.pw .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:800;color:var(--ember);padding:8px}
.ferr{color:var(--blaze);font-weight:700;font-size:13.5px;min-height:1.2em;margin:4px 0}

.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{border:1px solid var(--line)}
.gdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;background:#1C1525;color:#fff}
.guest{display:block;margin:14px auto 0;font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;animation:spin .8s linear infinite;vertical-align:-3px}

/* home v2 */

.gp{--c:var(--ember);padding:14px 8px;border-radius:16px;border:1.5px solid var(--line);font-weight:800;font-size:14px;background:var(--surface-2);transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.gp i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.5;transition:all .2s}
.gp.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface-2))}
.gp.on i{opacity:1;transform:scale(1.3);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);margin-bottom:14px;font-weight:700}
.field input[type=time]{font:inherit;font-weight:800;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}

/* notification */
.notif{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(430px,calc(100% - 24px));z-index:80;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);animation:notifIn .6s cubic-bezier(.2,1.2,.3,1) both;text-align:left}
.notif.out{animation:notifOut .35s ease-in both}
@keyframes notifIn{from{transform:translate(-50%,-140%)}}
@keyframes notifOut{to{transform:translate(-50%,-140%);opacity:0}}
.notif .ai{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none;color:#fff;font-family:var(--display);font-weight:800;font-style:italic;font-size:20px}
.notif .nt{flex:1;min-width:0}
.notif small{font-size:11.5px;color:var(--muted);font-weight:700}
.notif b{display:block;font-size:14.5px}
.notif p{font-size:13px;color:var(--muted)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:90;display:flex;gap:8px;align-items:center;animation:toast 2.4s both;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}

/* progress */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-h b{font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;font-style:italic}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal-g .wh{font-size:11px;font-weight:800;color:var(--muted);padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;position:relative;color:var(--muted)}
.cd.done{background:color-mix(in srgb,var(--mint) 22%,transparent);color:var(--fg)}
.cd.done::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--mint)}
.cd.miss{background:color-mix(in srgb,var(--blaze) 14%,transparent);color:var(--fg)}
.cd.miss::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--blaze)}
.cd.plan{border:1.5px dashed color-mix(in srgb,var(--ember) 60%,var(--line));color:var(--fg)}
.cd.tdy{background:var(--grad);color:#fff;font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:4px}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:150px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:24px}
.bc{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bc .b{width:100%;max-width:30px;border-radius:9px 9px 4px 4px;background:var(--surface-2);position:relative;overflow:hidden;height:100%}
.bc .b i{position:absolute;left:0;right:0;bottom:0;background:var(--grad);border-radius:9px 9px 4px 4px;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}
.bc small{font-size:11px;color:var(--muted);font-weight:700}
.bc em{font-style:normal;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.sample{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:8px}

/* profile */
.prof{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.prof .avatar{width:64px;height:64px;border-radius:20px;font-size:30px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .tx{flex:1;font-weight:700}
.li .tx small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;padding-block:24px 30px}
.login .blob{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0}
.login .b1{background:#FF6A2A;top:-120px;left:-120px;animation:float1 12s ease-in-out infinite alternate}
.login .b2{background:#FF2E63;top:40px;right:-180px;animation:float2 14s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(80px,60px) scale(1.1)}}
@keyframes float2{to{transform:translate(-70px,90px) scale(.95)}}
.login>*{position:relative;z-index:1}
.login .hero-fig{width:62%;max-width:240px;margin:0 auto 6px}
.login .hero-fig .hl{stroke:var(--ember)}
.login .tag-l{font-family:var(--display);font-weight:800;font-style:italic;font-size:56px;line-height:.88;text-transform:uppercase}
.login .tag-l span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.inp{width:100%;font:inherit;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;transition:border-color .2s}
.inp:focus{outline:none;border-color:var(--ember)}
.form{display:flex;flex-direction:column;gap:10px;margin-top:22px}

/* session */
.sess-top{display:flex;align-items:center;gap:12px;padding-block:14px}
.segs{flex:1;display:flex;gap:4px;min-width:0}
.segs i{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.segs i.d{background:var(--mint)}
.segs i.c::after{content:"";position:absolute;inset:0;width:var(--w,0%);background:var(--ember);border-radius:5px;transition:width .4s}
.setdots{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
.setdots i{width:34px;height:8px;border-radius:8px;background:var(--line);transition:all .3s}
.setdots i.d{background:var(--mint)}
.setdots i.c{background:var(--ember);width:50px}
.rest-ov{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;animation:fade .3s both;padding:24px}
.ring{position:relative;width:220px;height:220px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .rbg{stroke:var(--line)}
.ring .rfg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:72px;font-variant-numeric:tabular-nums}
.done-hero{text-align:center;padding-top:40px}
.burst{position:relative;width:140px;height:140px;margin:0 auto 20px}
.burst .core{position:absolute;inset:20px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.burst .core svg{width:48px;height:48px;stroke-width:3}
.burst i{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;animation:spark .9s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes pop{from{transform:scale(0)}}
@keyframes spark{from{transform:translate(-50%,-50%) scale(.2);opacity:1}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1);opacity:0}}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(436px,calc(100% - 24px));z-index:50;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;box-shadow:var(--shadow)}
.nav[hidden]{display:none!important}
/* El atributo hidden tiene que ganarle a cualquier display de una clase (por ejemplo el botón "Hoy",
   que tiene display:inline-flex y sin esta regla se veía aunque estuviera oculto). */
[hidden]{display:none!important}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:17px;color:var(--muted);font-size:10.5px;font-weight:800;position:relative;z-index:1;transition:color .25s}
.nav button.on{color:#fff}
.nav .pillbg{position:absolute;top:7px;bottom:7px;left:7px;width:calc((100% - 14px)/5);border-radius:17px;background:var(--grad);transition:transform .45s cubic-bezier(.3,1.3,.5,1);z-index:0;box-shadow:0 6px 16px var(--glow)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (min-width:700px){
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

 // contra el historial real: lo que ya entrenaste vs. el próximo día planificado
 const tk=key(TODAY);Object.keys(G).filter(g=>[0,1,2,3,4,5,6].some(d=>r[d].g.includes(g))).forEach(g=>{const last=lastTrained(g,kAdd(tk,1));if(!last)return;
  let from=kAdd(last,1);if(from<tk)from=tk;const nx=nextPlanned(g,from);const ok=kAdd(last,2);

  else t.push(['info',`${nm(g)}: lo hiciste ${fmtD(last)}.${nx?` Próximo: ${fmtD(nx)}.`:''}`])});
 for(let d=0;d<7;d++)if(r[d].g.length>3)t.push(['warn',`El ${DAYL[d].toLowerCase()} tiene ${r[d].g.length} grupos. Mejor 1 o 2 por día para entrenar con calidad.`]);

function strTick(){if(!SST||!SST.run)return;SST.left--;const n=document.getElementById('sstN'),r=document.getElementById('sstR'),x=SST.list[SST.i];if(n)n.textContent=Math.max(0,SST.left);
 if(r){const C=2*Math.PI*96;r.setAttribute('stroke-dashoffset',(C*(1-SST.left/x.hold)).toFixed(1))}
 if(SST.left===10&&x.hold>=20)Coach.say('Respirá lento, aflojá.',false,'calm');
 if(SST.left<=0)strNext()}
function strNext(back){const x=SST.list[SST.i];if(back){if(SST.side===1){SST.side=0}else if(SST.i>0){SST.i--;SST.side=0}SST.left=SST.list[SST.i].hold;render();strSay();return}
 if(x.sides&&SST.side===0){SST.side=1;SST.left=x.hold;render();strSay();return}
 if(SST.i<SST.list.length-1){SST.i++;SST.side=0;SST.left=SST.list[SST.i].hold;render();strSay();return}
 clearInterval(sstT);SST.done=true;try{DB.guardarSesion({id:'s'+Date.now(),fecha:new Date().toISOString(),ejercicioId:'elongacion',grupo:'elongacion',zona:SST.list.map(x=>x.id).join(','),modo:'elongacion',objetivo:null,reps:0,completado:true,duracionSeg:Math.round((Date.now()-SST.t0)/1000),pausas:0,conteo:'tiempo'})}catch(e){}

// anatomy(e): bloque "Dónde está" del ejercicio: botones de músculos arriba (lo primero que se lee),
// figura con los músculos en naranja según intensidad, y debajo la explicación del músculo elegido.
function anatomy(e){const mz=MZ[e.id];const mzx={...mz,w:MZW[e.id]};const tgt=e.pri[0];
 const fib=[[60,60],[60,33],[83,46],[83,74],[60,87],[37,74],[37,46]];
 return `<div class="anat"><div class="anat-h"><b>Dónde está</b><button class="b3d${B3D?' on':''}" data-act="b3d" aria-label="Ver figura en 3D"><i>2D</i><i>3D</i></button></div>
  <p class="muted" style="font-size:12px;font-weight:700;margin:0 0 8px">Tocá un músculo para verlo de cerca</p>
  <div class="mus" style="margin:0 0 10px">${e.pri.map(m=>`<button class="m p" data-act="mzoom" data-m="${m}"><i></i>${m}</button>`).join('')}${e.sec.map(m=>`<button class="m" data-act="mzoom" data-m="${m}"><i></i>${m}</button>`).join('')}</div>
  <div class="bodies im" id="bodies">${regViews(mzx).map((v,i)=>`<figure data-v="${v}"${i?'':' class="big"'}>${bodySVG(v,mzx,{tap:1,fit:1})}<figcaption>${v==='f'?(regViews(mzx).includes('b')?'Frente · la espalda se ve al tocar sus músculos':'Frente'):'Espalda'}</figcaption></figure>`).join('')}</div>
  <div class="legend2 heat"><span>Menos</span><i class="hbar"></i><span>Más trabajo</span></div><p class="bsrc">Figura del cuerpo: vue-human-muscle-anatomy · <button class="link" data-act="bodylic">Licencia MIT</button></p>
  <div class="minfo" id="mInfo" hidden></div></div>
 <div class="anat zoom"><div class="anat-h"><b>Cómo trabaja: ${tgt}</b><div class="seg" role="tablist">${[.25,.4,.7].map(v=>`<button data-act="fspeed" data-s="${v}" class="${v===.4?'on':''}">${v}x</button>`).join('')}</div></div>
  <div class="focus-stage"><span class="slow"><i></i>Cámara lenta</span><div data-fig="${e.id}" data-mode="focus"></div></div>
  <div class="zoom-l"><b id="zLbl">${mz.iso?'Isométrica: tensión constante':'Contracción'}</b><div class="tens"><i id="zTens"></i></div></div>
  <p class="muted" style="font-size:12.5px;margin-top:6px">${mz.iso?'El músculo no cambia de largo: sostiene la tensión todo el tiempo. Mirá cómo se mantiene encendido.':'Mirá el músculo resaltado: se enciende y se engrosa cuando se contrae, y se afina cuando se estira bajo control. Las dos fases construyen fuerza.'}</p></div>
 <div class="anat"><div class="anat-h"><b>Cómo crece</b></div>
  <div class="steps3" id="gSteps">${['1 · Entrenás','2 · Descansás','3 · Crece'].map((t,i)=>`<button data-act="gstep" data-i="${i+1}">${t}</button>`).join('')}</div>

   ${fib.map(([x,y])=>`<circle class="fb" cx="${x}" cy="${y}" r="12"/>`).join('')}
   ${fib.map(([x,y])=>`<path class="tear" d="M${x-6} ${y-2}l4 4 3-5 4 4"/>`).join('')}
   ${[...Array(10)].map((_,i)=>{const a=i/10*Math.PI*2,x=60+Math.cos(a)*28,y=60+Math.sin(a)*28;return `<circle class="nut" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" style="--nx:${(Math.cos(a)*30).toFixed(0)}px;--ny:${(Math.sin(a)*30).toFixed(0)}px;animation-delay:${(i*.16).toFixed(2)}s"/>`}).join('')}</svg>
   <p id="gTxt"></p></div>
  <p class="muted" style="font-size:12px;margin-top:8px">Corte transversal de fibras musculares (ilustrativo).</p></div>`}
const GTXT=['','<b>Entrenás.</b> El esfuerzo genera microlesiones en las fibras. Es normal y es la señal para adaptarse.','<b>Descansás 48 h.</b> Con proteína y sueño, el cuerpo repara las fibras y suma material nuevo.','<b>Crece.</b> Las fibras quedan más gruesas y fuertes. Repetir el ciclo es lo que da resultados.'];
let growT=null,growI=1;
function setGrow(i){growI=i;const g=document.getElementById('grow');if(!g)return;g.className='grow st'+i;document.getElementById('gTxt').innerHTML=GTXT[i];document.querySelectorAll('#gSteps button').forEach((b,j)=>b.classList.toggle('on',j+1===i))}

}

 if(!mz.iso){const lbl=document.getElementById('zLbl');const d=c-(f.lc??c);if(lbl&&Math.abs(d)>.001){const txt=d>0?'Contrae: se acorta y se engrosa':'Estira: baja lento, bajo control';if(lbl.textContent!==txt)lbl.textContent=txt}}f.lc=c}

/* ---------- motor de postura v2 ----------

   2) Ángulos medidos en 3D (worldLandmarks, en metros): no dependen de la distancia ni del ángulo de la cámara.

function measure2(il,wl,id,vw,vh){const S2={L:SIDE.L,R:SIDE.R},vis=sd=>Math.min(il[sd.sh][2],il[sd.hip][2],(il[sd.el][2]+il[sd.wr][2]+il[sd.kn][2]+il[sd.an][2])/4);

function slotHTML(n,delay=0){const ds=String(n).split('');return `<x-sl aria-label="${n}">${ds.map((c,i)=>{const d=+c,loops=1+(ds.length-1-i>0?0:1),seq=[];for(let k=0;k<=loops*10+d;k++)seq.push(k%10);

  const t=el.textContent.trim(),m=/^(\d{1,4})(%?)$/.exec(t);if(!m)return;el.dataset.rolled=1;el.innerHTML=slotHTML(m[1],j++*.08)+(m[2]?m[2]:'')})}

function startRoutine(dow,ov){document.querySelectorAll('.notif').forEach(x=>x.remove());let list=ov?ov.list:planFor(dow);if(!list.length)list=['squat','crunch','bridge'];
 SES={list,i:0,set:0,r:0,done:{},prev:{},t0:Date.now(),tx:Date.now(),voice:true,vstate:'off',k:key(TODAY),g:S.routine[dow].g.slice(),cfg:ov?ov.cfg:(S.routine[dow].cfg||{}),from:S.view==='notifs'?'notifs':null};list.forEach(id=>SES.prev[id]=prevSes(id));S.fromSes=false;go('session');
 if(SES.voice)setTimeout(()=>Coach.ev('blind',{ex:EXI[list[0]].name.toLowerCase()}),500)}
const sesVoiceOn=()=>SES&&SES.voice&&!SES.finished&&!isSecs(SES.list[SES.i]);
function sesBind(){if(!SES)return;if(!sesVoiceOn()){if(Voice.on&&S.view==='session')Voice.stop();SES.vstate='off';return}
 if(!Voice.on){SES.vstate='starting';Voice.start(()=>sesRep(),(rms,thr)=>{const i=document.getElementById('micLvl');if(i)i.style.width=Math.min(100,rms/(thr*2)*100).toFixed(0)+'%'},st=>{if(SES){SES.vstate=st;const m=document.getElementById('sesMic');if(m)m.textContent=st==='denied'?'No pudimos usar el micrófono: tocá "Terminé la serie" al terminar.':'Te escucho: decí el número en cada repetición bien hecha.'}})}}
function sesRep(d=1){if(!SES||SES.finished||document.getElementById('restOv')||SES.lock)return;const id=SES.list[SES.i],goal=repsOf(id);SES.r=Math.max(0,SES.r+d);
 const b=document.getElementById('sesN');if(b)b.textContent=SES.r;const c=document.getElementById('sesCnt');if(c){c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
 if(d<0)return;try{navigator.vibrate&&navigator.vibrate(35)}catch(e){}
 if(SES.r>=goal&&sesVoiceOn()){SES.lock=true;Coach.ev('setok');setTimeout(()=>{SES&&(SES.lock=false);sesSetDone()},1100)}else if(SES.r>=goal){}else if(goal-SES.r===1)Coach.ev('last');else Coach.ev('rep',{n:SES.r})}
function sesSetDone(){if(!SES||SES.finished)return;const e=EXI[SES.list[SES.i]];SES.done[e.id]=(SES.done[e.id]||0)+(isSecs(e.id)?repsOf(e.id):SES.r||repsOf(e.id));SES.r=0;SES.set++;
 if(SES.set>=setsOf(e.id)){const n=SES.done[e.id],cmp=cmpLine(n,SES.prev[e.id]);
  DB.guardarSesion({id:'s'+Date.now(),fecha:new Date().toISOString(),ejercicioId:e.id,grupo:e.g,zona:e.sub,modo:'rutina',objetivo:setsOf(e.id)*repsOf(e.id),reps:n,completado:true,duracionSeg:Math.round((Date.now()-SES.tx)/1000),pausas:0,conteo:sesVoiceOn()?'voz':'manual'});SES.tx=Date.now();
  SES.i++;SES.set=0;if(SES.i>=SES.list.length){SES.finished=true;Voice.stop();recordDay(true);try{NAT()&&NAT().cancel(200)}catch(e){}render();setTimeout(confetti,300);if(SES.voice){const tot=Object.values(SES.done).reduce((a,b)=>a+b,0);Coach.ev('routine');Coach.say(`Hoy hiciste ${tot} repeticiones en total.`,true)}return}
  startRest(EXI[SES.list[SES.i]].name,cmp);render();if(SES.voice){if(cmp)Coach.say(cmpSpeak(SES.done[e.id],SES.prev[e.id]));Coach.ev('next',{ex:EXI[SES.list[SES.i]].name.toLowerCase()},true)}}
 else{startRest(`${e.name} · serie ${SES.set+1}`);render();if(SES.voice)Coach.ev('rest')}}

 S.dia[k]={grupos:SES.g||[],lista:SES.list,total:SES.list.length,hechos:completo?SES.list.length:SES.i,completo,minutos:Math.max(1,Math.round((Date.now()-SES.t0)/60000)),hora:new Date().toTimeString().slice(0,5)};

// Aviso previo (unas horas antes) y aviso de "estás a tiempo" (unas horas después, si no la hiciste)
function preAt(d){const [hh,mm]=S.rem.time.split(':').map(Number);if(hh<12)return null;const t=new Date(d);t.setHours(Math.max(9,hh-4),mm,0,0);return t}
function followAt(d){const [hh,mm]=S.rem.time.split(':').map(Number);if(hh>=21)return null;const t=new Date(d);t.setHours(Math.min(21,hh+3),hh+3>=21?30:mm,0,0);return t}
// Programa los recordatorios con AlarmManager de Android (por el puente nativo),
// así suenan aunque la app esté cerrada.
function syncReminders(){const N=NAT();if(!N)return;
 for(let i=0;i<14;i++){try{N.cancel(i);N.cancel(100+i);N.cancel(200+i)}catch(e){}}
 if(!S.rem.on)return;const [hh,mm]=S.rem.time.split(':').map(Number);const now=Date.now();let n=0;
 for(let i=0;i<14;i++){const d=addD(TODAY,i);if(!planFor(d.getDay()).length)continue;const at=new Date(d);at.setHours(hh,mm,0,0);if(+at<=now+30000)continue;
  const [t,b]=remText(d),nm=gnames(S.routine[d.getDay()].g).toLowerCase()||'tu rutina',sc=(id,w,a,c)=>{try{N.schedule(id,+w,a,c)}catch(e){try{N.scheduleInexact(id,+w,a,c)}catch(e2){}}};
  sc(i,at,t,b);n++;
  const pa=preAt(d);if(pa&&+pa>now)sc(100+i,pa,`Hoy a las ${S.rem.time}: ${nm}`,'Andá preparándote. ¡Hoy se entrena!');
  const fu=followAt(d);if(fu&&+fu>now&&!(i===0&&status(TODAY)==='done'))sc(200+i,fu,'Estás a tiempo',`Todavía podés hacer ${nm} hoy.`)}
 return n}
